<!DOCTYPE html>
<html>
<head>
    <title>Beer List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h1 class="mb-4">🍺 Beer List</h1>

{% with messages = get_flashed_messages() %}
  {% if messages %}
    <div class="alert alert-danger">
      {% for msg in messages %}
        <div>{{ msg }}</div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}

<form action="/add" method="POST" class="mb-4">

    <input type="text" name="name" placeholder="Beer Name" class="form-control mb-2" required>

    <input type="text" name="brewery" placeholder="Brewery" class="form-control mb-2" required>

    <input type="number" step="0.1" name="abv" placeholder="ABV %" class="form-control mb-2" required>

    <button type="submit" class="btn btn-primary">Add Beer</button>

</form>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Name</th>
            <th>Brewery</th>
            <th>ABV (%)</th>
            <th>Action</th> <!-- NEW COLUMN -->
        </tr>
    </thead>
    <tbody>
        {% for beer in beers %}
        <tr>
            <td>{{ beer.name }}</td>
            <td>{{ beer.brewery }}</td>
            <td>{{ beer.abv }}</td>
            <td>
                <!-- DELETE BUTTON -->
                <a href="/delete/{{ beer.id }}" class="btn btn-danger btn-sm">
                    Delete
                </a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

</body>
</html>
