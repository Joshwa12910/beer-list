<!DOCTYPE html>
<html>
<head>
    <title>Beer List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h1 class="mb-4">🍺 Beer List</h1>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Name</th>
            <th>Brewery</th>
            <th>ABV (%)</th>
        </tr>
    </thead>
    <tbody>
        {% for beer in beers %}
        <tr>
            <td>{{ beer.name }}</td>
            <td>{{ beer.brewery }}</td>
            <td>{{ beer.abv }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

</body>
</html>
